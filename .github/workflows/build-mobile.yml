name: Build

on:
  workflow_dispatch:
  push:
    paths: ['.gitmodules', 'node-source.json', 'node', 'patches/**', 'src/**', 'tools/**', 'scripts/**']
  pull_request:
    paths: ['.gitmodules', 'node-source.json', 'node', 'patches/**', 'src/**', 'tools/**', 'scripts/**']

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_NDK_VERSION: r27d

jobs:
  check-release:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.release.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - name: Check for an existing release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          version = json.loads(Path('node-source.json').read_text())['version']
          header = Path('src/node_mobile_version.h').read_text()
          revision = re.search(r'^#define NODE_MOBILE_REVISION (\d+)$', header, re.M)
          if not revision:
              raise RuntimeError('Cannot determine NODE_MOBILE_REVISION')
          tag = f'v{version}-{revision[1]}'
          url = f'{os.environ["GITHUB_API_URL"]}/repos/{os.environ["GITHUB_REPOSITORY"]}/releases/tags/{tag}'
          request = Request(url, headers={
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {os.environ["GITHUB_TOKEN"]}',
              'User-Agent': 'nodejs-mobile-build',
          })
          try:
              with urlopen(request, timeout=30):
                  build = False
          except HTTPError as error:
              if error.code != 404:
                  raise
              build = True
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'build={str(build).lower()}\n')
          print(f'{tag}: ' + ('no release found; building.' if build else 'release already exists; skipping build.'))
          PY

  verify-source:
    needs: check-release
    if: needs.check-release.outputs.build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Reconstruct and verify patches
        run: |
          python scripts/prepare.py
          python scripts/verify.py --unit-tests

  build-android:
    needs: verify-source
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        arch: [arm, arm64, x64]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install 32-bit host support
        if: matrix.arch == 'arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          local-cache: false
          add-to-path: false
      - name: Build library and validate addon exports
        run: >-
          python scripts/build.py android
          --ndk '${{ steps.ndk.outputs.ndk-path }}'
          --arch '${{ matrix.arch }}'
          --output '.build/artifacts/android-${{ matrix.arch }}'
      - uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.arch }}
          path: .build/artifacts/android-${{ matrix.arch }}
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  build-ios:
    needs: verify-source
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: arm64, runner: macos-15}
          - {target: arm64-simulator, runner: macos-15}
          - {target: x64-simulator, runner: macos-15-intel}
    runs-on: ${{ matrix.runner }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build framework and validate addon exports
        run: >-
          python scripts/build.py ios
          --target '${{ matrix.target }}'
          --output '.build/artifacts/ios-${{ matrix.target }}'
      - uses: actions/upload-artifact@v7
        with:
          name: ios-${{ matrix.target }}
          path: .build/artifacts/ios-${{ matrix.target }}
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  combine-android:
    needs: build-android
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: android-*
          path: .build/inputs
      - run: python3 scripts/build.py combine-android --inputs .build/inputs --output .build/nodejs-mobile-android
      - name: Export dependency versions
        id: versions
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          metadata = json.loads(Path('.build/nodejs-mobile-android/build-info.json').read_text())
          print('versions=' + json.dumps({item['target']: item['versions'] for item in metadata['slices']}))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: nodejs-mobile-android
          path: .build/nodejs-mobile-android
          if-no-files-found: error
          overwrite: true

  combine-ios:
    needs: build-ios
    runs-on: macos-15
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: ios-*
          path: .build/inputs
      - run: python3 scripts/build.py combine-ios --inputs .build/inputs --output .build/nodejs-mobile-ios
      - name: Export dependency versions
        id: versions
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          metadata = json.loads(Path('.build/nodejs-mobile-ios/build-info.json').read_text())
          print('versions=' + json.dumps({item['target']: item['versions'] for item in metadata['slices']}))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: nodejs-mobile-ios
          path: .build/nodejs-mobile-ios
          if-no-files-found: error
          overwrite: true

  versions:
    needs: [combine-android, combine-ios]
    runs-on: ubuntu-24.04
    env:
      ANDROID_VERSIONS: ${{ needs.combine-android.outputs.versions }}
      IOS_VERSIONS: ${{ needs.combine-ios.outputs.versions }}
    steps:
      - name: Write dependency versions
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          versions = {
              'description': 'Build-time dependency versions from patched sources and target configuration.',
              'android': json.loads(os.environ['ANDROID_VERSIONS']),
              'ios': json.loads(os.environ['IOS_VERSIONS']),
          }
          Path('versions.txt').write_text(json.dumps(versions, indent=2) + '\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: versions.txt
          path: versions.txt
          archive: false
          if-no-files-found: error
          overwrite: true
